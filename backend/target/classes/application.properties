server.port=8080
spring.application.name=fraud-detection-system

# Logging
logging.level.com.frauddetect=DEBUG
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level){highlight} %clr([FraudDetect]){cyan} %msg%n

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
